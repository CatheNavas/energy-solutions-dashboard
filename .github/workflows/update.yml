name: Actualizar Dashboard Energy Solutions

on:
  schedule:
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generar dashboard
        env:
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
        run: python generate.py

      - name: Commit y push
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Dashboard actualizado: $(date '+%Y-%m-%d %H:%M UTC')"
          git push
